[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "ai-sdlc-orchestrator"
dynamic = ["version"]
description = "AI SDLC Orchestrator — coordinates AI agents through a complete Software Development Life Cycle"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.1.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "rich>=13.0",
    "structlog>=24.0",
    "watchfiles>=1.0",
]

[project.optional-dependencies]
monitoring = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20",
    "prometheus-client>=0.20",
]
dashboard = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "websockets>=12.0",
    "jinja2>=3.1",
]
mobile-api = [
    "psutil>=5.9",
    "qrcode>=7.4",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "websockets>=12.0",
    "pyyaml>=6.0",
]
all = [
    "ai-sdlc-orchestrator[monitoring,dashboard,mobile-api]",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "starlette>=0.27",
    "fastapi>=0.110",
    "pyyaml>=6.0",
]

[project.scripts]
orchestrate = "orchestrator.main:main"
orchestrate-watchdog = "orchestrator.watchdog:main"
orchestrate-dashboard = "orchestrator.dashboard.cli:main"
orchestrator-mobile-api = "orchestrator.mobile_api.server:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.hatch.build.hooks.vcs]
version-file = "src/orchestrator/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
