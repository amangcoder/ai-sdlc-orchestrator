name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # Fast unit tests — run first to fail quickly
  # ──────────────────────────────────────────────
  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests with coverage
        run: |
          python -m pytest tests/ \
            --ignore=tests/integration \
            --ignore=tests/test_performance_phase2.py \
            --ignore=tests/test_performance_phase3.py \
            --ignore=tests/test_self_orchestrate_speed.py \
            -v \
            --tb=short \
            --cov=src/orchestrator/log_analyzer \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            -x

      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage
          retention-days: 7

  # ──────────────────────────────────────────────
  # Log analyzer targeted tests — explicit gate
  # ──────────────────────────────────────────────
  log-analyzer-tests:
    name: Log Analyzer Test Suite
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run log_analyzer tests with full coverage gate
        run: |
          python -m pytest tests/test_log_analyzer.py \
            -v \
            --tb=long \
            --cov=src/orchestrator/log_analyzer \
            --cov-report=term-missing \
            --cov-report=html:htmlcov/log_analyzer \
            --cov-fail-under=80

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-analyzer-htmlcov
          path: htmlcov/log_analyzer/
          retention-days: 14

  # ──────────────────────────────────────────────
  # Integration tests — run after unit tests pass
  # ──────────────────────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mobile-api]"

      - name: Run integration tests
        run: |
          python -m pytest tests/integration/ \
            -v \
            --tb=short \
            -x
        env:
          ORCHESTRATOR_ENV: test

  # ──────────────────────────────────────────────
  # Lint / type check (fast, parallel with tests)
  # ──────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run ruff linter
        run: ruff check src/ tests/test_log_analyzer.py --select=E,F,W --ignore=E501

      - name: Check ruff formatting
        run: ruff format --check src/orchestrator/log_analyzer.py tests/test_log_analyzer.py
        continue-on-error: true
