# Loki configuration for the AI SDLC Orchestrator monitoring stack.
# Extends the default single-process local config with a longer reject_old_samples_max_age
# so historical run logs (up to 30 days old) can be ingested by Promtail.

auth_enabled: false

server:
  http_listen_port: 3100

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

ruler:
  alertmanager_url: http://localhost:9093

limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 720h   # accept logs up to 30 days old
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
