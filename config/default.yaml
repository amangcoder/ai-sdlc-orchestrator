workspace_dir: workspace
max_review_cycles: 3
max_budget_usd: 50.0
default_workflow: feature_development
enhanced_perception: false
max_concurrent_agents: 10         # max parallel agents; set to 2-4 on low-resource machines

phases:
  pm:
    agent: pm
    parallel: false
    max_retries: 2
    timeout_minutes: 15
  architect:
    agent: architect
    parallel: false
    max_retries: 2
    timeout_minutes: 20
  engineer:
    agent: engineer
    parallel: true
    max_retries: 2
    timeout_minutes: 30
  qa:
    agent: qa
    parallel: false
    max_retries: 1
    timeout_minutes: 15
  reviewer:
    agent: reviewer
    parallel: false
    max_retries: 1
    timeout_minutes: 15

agents:
  # --- Planning roles (structured reasoning → sonnet) ---
  pm:
    name: Product Manager
    model: sonnet
    max_turns: 25
    escalation_model: opus
    input_artifacts: []
    output_artifacts: [prd]
  architect:
    name: System Architect
    model: sonnet
    max_turns: 30
    escalation_model: opus
    input_artifacts: [prd]
    output_artifacts: [architecture, tasks]

  # --- Deep reasoning roles (high-stakes decisions → opus) ---
  principal_engineer:
    name: Principal Engineer
    model: opus
    max_turns: 30
    escalation_model: null
    input_artifacts: [prd, architecture]
    output_artifacts: [engineering_plan, tasks]

  # --- Task decomposition (structured output → sonnet) ---
  tpm:
    name: Technical Project Manager
    model: sonnet
    max_turns: 25
    escalation_model: opus
    input_artifacts: [prd, architecture, engineering_plan]
    output_artifacts: [tasks]

  # --- Implementation roles (code writing → sonnet, escalate to opus) ---
  engineer:
    name: Engineer
    model: sonnet
    max_turns: 80
    escalation_model: opus
    input_artifacts: [prd, architecture, tasks]
    output_artifacts: []
  frontend_engineer:
    name: Frontend Engineer
    model: sonnet
    max_turns: 80
    escalation_model: opus
    input_artifacts: [prd, architecture, tasks]
    output_artifacts: []
  backend_engineer:
    name: Backend Engineer
    model: sonnet
    max_turns: 80
    escalation_model: opus
    input_artifacts: [prd, architecture, tasks]
    output_artifacts: []
  database_engineer:
    name: Database Engineer
    model: sonnet
    max_turns: 60
    escalation_model: opus
    input_artifacts: [prd, architecture, tasks]
    output_artifacts: []
  caching_engineer:
    name: Caching & Performance Engineer
    model: sonnet
    max_turns: 60
    escalation_model: opus
    input_artifacts: [prd, architecture, tasks]
    output_artifacts: [benchmark_report]
  automation_engineer:
    name: Automation Engineer
    model: sonnet
    max_turns: 60
    escalation_model: opus
    input_artifacts: [prd, architecture, tasks]
    output_artifacts: []
  devops_engineer:
    name: DevOps Engineer
    model: sonnet
    max_turns: 40
    escalation_model: opus
    input_artifacts: [qa_report, review]
    output_artifacts: []
  observability_engineer:
    name: Observability Engineer
    model: sonnet
    max_turns: 40
    escalation_model: opus
    input_artifacts: [prd, architecture]
    output_artifacts: []

  # --- Quality gate roles (deep analysis → opus, no escalation needed) ---
  backend_reviewer:
    name: Backend Code Reviewer
    model: opus
    max_turns: 25
    escalation_model: null
    input_artifacts: [prd, architecture, tasks, qa_report]
    output_artifacts: [review]
  frontend_reviewer:
    name: Frontend Code Reviewer
    model: opus
    max_turns: 25
    escalation_model: null
    input_artifacts: [prd, architecture, tasks]
    output_artifacts: [review]
  security_engineer:
    name: Security Engineer
    model: opus
    max_turns: 30
    escalation_model: null
    input_artifacts: [prd, architecture]
    output_artifacts: [threat_model, vulnerability_report]

  # --- QA roles (test execution → sonnet, escalate to opus) ---
  qa_planner:
    name: QA Planner
    model: sonnet
    max_turns: 25
    escalation_model: opus
